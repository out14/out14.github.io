        async function callData(){

            const params = new URLSearchParams(location.search);
            const nickname = params.get('nickname');

            //json 에서 정보 가져오기
            await fetch('/package/data/data.json')
            .then(res=>res.json())
            .then(data=>{

                const findData = data.find(e=>e.nickname===nickname)
                // const findData = data.map(e=>e.nickname)

                console.log('???',findData,data)    
                
                const page =document.querySelector('.portfolioView')

                page.innerHTML =`
                    ${findData.title} 포트폴리오 상세 페이지
                    <img src="${findData.thumbnail}" alt="포폴 상세 이미지"/>
                    ${findData.description}
                    ${findData.tag}
                `

            })

            

        } 
        callData()
