<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="/package/css/common.css">
    <link rel="stylesheet" href="/package/css/base.css">
    <link rel="stylesheet" href="/package/css/style.css">

    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });
      </script>
</head>
<body>
    <header></header>
    about
    <footer></footer>
    <script>
     const pathFile = window.location.pathname.split('/').pop();
      const pathName = pathFile.split('.')[0];

      document.querySelectorAll('.header_ul li').forEach(tab => {
          tab.classList.toggle('on', tab.id === pathName);
      });
    </script>
</body>
</html>
