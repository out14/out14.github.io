<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="/package/css/common.css">
    <link rel="stylesheet" href="/package/css/base.css">
    <link rel="stylesheet" href="/package/css/style.css">

    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });
      </script>
</head>
<body>
    <header></header>
    about
    <footer></footer>
    <script>
      const locationPath = window.location.pathname.split('/');
          const pathFile = locationPath[locationPath.length - 1];
          const pathName = pathFile.split('.')[0]
          console.log(pathName)

          for(i = 0; i < document.querySelector('.header_ul li').length; i++ ){

              const tab = document.querySelector('.header_ul li')[i];
              if(
                  tab.id==pathName
              ){
                  tab.classList.add('on')
              } else {
                  tab.classList.remove('on')
              }

          }
    </script>
</body>
</html>
