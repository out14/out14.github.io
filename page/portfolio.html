<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/package/css/common.css">
    <link rel="stylesheet" href="/package/css/base.css">
    <link rel="stylesheet" href="/package/css/style.css">

    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });

        
      </script>
    <title>Portfolio</title>
    <script src="/package/script/list.js" type="text/javascript"></script>
    
</head>
<body>
    <header></header>
    리스트
    <ul class="portfolioList"></ul>
    <footer></footer>
    
    <script>

        // showList();
        fetch('/package/data/data.json')
        .then(res =>res.json())
        .then(data =>{
            const list = document.querySelector('.portfolioList');
            data.forEach(element => {
                const li = document.createElement('li');
                li.innerHTML =`
                    <a href="#">
                        <div class="portfolio_image">
                            <img src="${element.image}" alt="${element.title}">
                        </div>

                         <div class="portfolio_info">
                            <div class="portfolio_info_type ${element.category}">
                                <span>${element.category}</span>
                            </div>
                            <h3>${element.title}</h3>
                            <p>${element.description}</p>
                        </div>
                    </a>
                `
                list.appendChild(li);
            });


        }) .catch(error => {
            console.error('포트폴리오 데이터를 불러오지 못했습니다.', error);
        });
    </script>
    
</body>
</html>
