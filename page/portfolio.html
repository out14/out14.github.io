<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });
      </script>
    <title>Portfolio</title>
    <script src="/package/script/list.js" type="javascript"></script>
</head>
<body>
    <header></header>
    <ul class="portfolioList"></ul>
    <footer></footer>
    
    
</body>
</html>
