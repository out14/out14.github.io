<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });
      </script>
    
</head>
<body>
    <header></header>
    <div class="main">
      <div class="main_img">
        <img class="main_img_code" src="/package/image/main_code.png" alt="코드">
        <img class="main_img_design" src="/package/image/main_design.png" alt="디자인">
        <img class="main_img_node" src="/package/image/main_node.png" alt="노드">
        <img class="main_img_bottle" src="/package/image/main_bottle.png" alt="병">
      </div>
      <!-- <img class="main_bg" src="/package/image/main_bg.png" alt="메인 이미지"> -->
      <img class="main_bg" src="/package/image/bg.jpg" alt="배경 이미지">
    </div>
    <footer></footer>
</body>
</html>
