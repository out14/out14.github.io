<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    <script>
        fetch('/package/components/header.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('header').innerHTML = html;
          });
    
        fetch('/package/components/footer.html')
          .then(res => res.text())
          .then(html => {
            document.querySelector('footer').innerHTML = html;
          });
      </script>
    
</head>
<body>
    <header></header>
    <div class="main">
      <div class="main_cnt">
        <div class="main_txt">
          <div class="main_txt_title">
            디자이너가 말아주는 퍼블리싱
          </div>
        </div>
        <div class="main_img">
          <img class="main_img_code" src="/package/image/main_code.png" alt="코드">
          <img class="main_img_design" src="/package/image/main_design.png" alt="디자인">
          <img class="main_img_node" src="/package/image/main_node.png" alt="노드">
          <img class="main_img_bottle" src="/package/image/main_bottle.png" alt="병">
        </div>
        <div class="main_wave">
          <div class="main_wave_one"></div>
          <div class="main_wave_two"></div>
          <div class="main_wave_three"></div>
        </div>
      </div>
      <!-- <img class="main_bg" src="/package/image/main_bg.png" alt="메인 이미지"> -->
      <img class="main_bg" src="/package/image/bg.jpg" alt="배경 이미지">
    </div>
    <div class="main_feature">
      <ul class="main_feature_list">
        <li>
          <img src="" alt="디자인">
          <h3>디자인을 이해하는 퍼블리싱</h3>
          <p>
            디자인 의도를 정확히 파악하고 픽셀 단위까지 섬세하게 구현합니다.
          </p>
        </li>
        <li>
          <img src="" alt="반응형">
          <h3>완벽한 반응형 구현</h3>
          <p>
            모바일부터 데스크탑까지 모든 디바이스에 최적화된 웹을 만듭니다.
          </p>
        </li>
        <li>
          <img src="" alt="유지보수">
          <h3>깔끔하고 유지보수 쉬운 코드</h3>
          <p>
            시맨틱 마트업과 체계적인 CSS 구조로 유지보수가 쉬운 코드를 작성합니다.
          </p>
        </li>
        <li>
          <img src="" alt="개발경험">
          <h3>개발 경험으로 완성도 UP</h3>
          <p>
            React 개발 경험을 바탕으로 인터렉션과 기능 구현까지 고려합니다.
          </p>
        </li>
      </ul>
    </div>
    <footer></footer>
</body>
</html>
