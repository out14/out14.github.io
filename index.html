</head>

          <div class="main_txt_title gmarket">
            <h1>디자이너가</h1>
            <p class="nanum">말아주는</p>
            <h1>퍼블리싱</h1>
          </div>
          <img class="main_img02" src="/package/image/main_img01.png" alt="메인 이미지01">
          <!-- 
          <img class="main_img_code" src="/package/image/main_code.png" alt="코드">
          <img class="main_img_design" src="/package/image/main_design.png" alt="디자인">
          <img class="main_img_node" src="/package/image/main_node.png" alt="노드">
          <img class="main_img_bottle" src="/package/image/main_bottle.png" alt="병"> 
          -->

          <img src="/package/image/main_postit.png" class="main_postit" alt="포스트잇">
        </div>
        
      </div>
      <!-- <img class="main_bg" src="/package/image/main_bg.png" alt="메인 이미지"> -->
      <img class="main_bg" src="/package/image/bg.jpg" alt="배경 이미지">
    </div>
    <div class="main_body">
      <div class="main_body_cnt">
        <div class="main_feature">
          <ul class="main_feature_list">
            <li>
              <dl class="main_feature_list_item">
                <dt>
                  <img src="/package/image/main_icon01.png" alt="디자인">
                </dt>
                <dd>
                  <h3>디자인을 이해하는 퍼블리싱</h3>
                  <p>
                    디자인 의도를 정확히 파악하고 픽셀 단위까지 섬세하게 구현합니다.
                  </p>
                </dd>
              </dl>
            </li>
            <li>
              <dl class="main_feature_list_item">
                <dt>
                  <img src="/package/image/main_icon02.png" alt="반응형">
                </dt>
                <dd>
                  <h3>완벽한 반응형 구현</h3>
                  <p>
                    모바일부터 데스크탑까지 모든 디바이스에 최적화된 웹을 만듭니다.
                  </p>
                </dd>
              </dl>
            </li>
            <li>
              <dl class="main_feature_list_item">
                <dt>
                  <img src="/package/image/main_icon03.png" alt="유지보수">
                </dt>
                <dd>
                  <h3>깔끔하고 유지보수 쉬운 코드</h3>
                  <p>
                    시맨틱 마트업과 체계적인 CSS 구조로 유지보수가 쉬운 코드를 작성합니다.
                  </p>
                </dd>
              </dl>
            </li>
            <li>
              <dl class="main_feature_list_item">
                <dt>
                  <img src="/package/image/main_icon04.png" alt="개발경험">
                </dt>
                <dd>
                  <h3>개발 경험으로 완성도 UP</h3>
                  <p>
                    React 개발 경험을 바탕으로 인터렉션과 기능 구현까지 고려합니다.
                  </p>
                </dd>
              </dl>
            </li>
          </ul>
        </div>
        <div class="main_portfolio">
          <div class="swiper">
            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
              <!-- Slides -->
              <div class="swiper-slide">Slide 1</div>
              <div class="swiper-slide">Slide 2</div>
              <div class="swiper-slide">Slide 3</div>
              ...
            </div>
            <!-- If we need pagination -->
            <div class="swiper-pagination"></div>
          
            <!-- If we need navigation buttons -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
          
            <!-- If we need scrollbar -->
            <div class="swiper-scrollbar"></div>
          </div>

        </div>
      </div>
    </div>
    <footer></footer>

    <script>
      const swiper = new Swiper('.swiper', {
          // Optional parameters
          //direction: 'hori',
          loop: true,

          // If we need pagination
          pagination: {
            el: '.swiper-pagination',
          },

          // Navigation arrows
          navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
          },

          // And if we need scrollbar
          scrollbar: {
            el: '.swiper-scrollbar',
          },
        });


        
      
            
            
    </script>
